# created-by: snowflake-apps-create; template=nextjs-template; skill-version=1.0.0
version: 2

name: MISSION_CONTROL
database: MLOPS_CONTROL
schema: APPS
query_warehouse: FRAUD_WH

label: "Mission Control"
description: "Agentic MLOps control room: live 3D twin of ML systems, incidents, agent flight recorder and approval-gated actions."
icon: public/icon.svg

ignore:
  - node_modules
  - .env*
  - __pycache__
  - "*.pyc"
  - .next
  - .git
  - snowflake.log

install:
  commands:
    - ["npm", "ci", "--include=dev"]

build:
  commands:
    - ["npm", "run", "build"]
    - ["cp", "-r", ".next/static", ".next/standalone/.next/static"]
    - ["cp", "-r", "public", ".next/standalone/public"]
    - ["rm", "-rf", "node_modules"]

run:
  command: ["node", ".next/standalone/server.js"]
